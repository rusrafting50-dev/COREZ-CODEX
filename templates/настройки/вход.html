{% extends 'base.html' %}
{% block title %}Вход в Настройки — СЧИТАЛКА{% endblock %}

{% block breadcrumb %}
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">Главная</a></li>
    <li class="breadcrumb-item active">Настройки — вход</li>
  </ol>
{% endblock %}

{% block content %}

<div class="d-flex justify-content-center">
  <form method="post" style="max-width:360px" class="w-100">
    <div class="card">
      <div class="card-header fw-semibold py-2 bg-secondary text-white">Вход в Настройки</div>
      <div class="card-body">
        <label class="form-label fw-semibold">Пароль</label>
        <input type="password" name="пароль" class="form-control" autofocus required>
        <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
      </div>
    </div>
  </form>
</div>

{% endblock %}
